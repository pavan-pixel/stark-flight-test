<script type="module">

const $=id=>document.getElementById(id);let scene,camera,renderer,clock,iron,world=[],shots=[],particles=[],speed=0,altitude=120,boosting=false,hovering=false,energy=100;let steer={x:0,y:0},joyActive=false,joyId=null,lastShot=0,cinematicTime=0,cinematicActive=true,cityLights=[],traffic=[];

function makeFallback(){const g=new THREE.Group();const red=new THREE.MeshStandardMaterial({color:0x9f1c22,metalness:.8,roughness:.27}),gold=new THREE.MeshStandardMaterial({color:0xc69a4d,metalness:.85,roughness:.22}),glow=new THREE.MeshBasicMaterial({color:0x5feaff});function part(geo,mat,pos,scale){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.scale.set(...scale);g.add(m);return m}part(new THREE.CapsuleGeometry(.36,.9,6,10),red,[0,0,0],[1,1,1]);part(new THREE.SphereGeometry(.29,16,12),gold,[0,.78,0],[1.05,1.1,.9]);part(new THREE.BoxGeometry(.36,.35,.14),glow,[0,.12,.36],[1,1,1]);for(let s of [-1,1]){part(new THREE.CapsuleGeometry(.13,.65,4,8),red,[s*.53,.15,0],[1,1,1]);part(new THREE.CapsuleGeometry(.12,.62,4,8),red,[s*.22,-.9,0],[1,1,1]);part(new THREE.SphereGeometry(.12,12,8),glow,[s*.53,-.2,.08],[1,1,1]);}g.scale.setScalar(1.5);return g}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x111c36);scene.fog=new THREE.FogExp2(0x17243a,.00145);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,2200);camera.position.set(0,3.5,9);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;document.body.prepend(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0x9dbdff,0x101522,1.7));const sun=new THREE.DirectionalLight(0xffc98c,2.8);sun.position.set(-80,150,70);scene.add(sun);const fill=new THREE.PointLight(0x38cfff,48,150);fill.position.set(0,4,4);scene.add(fill);makeSkyline();makeCity();loadIron();window.addEventListener('resize',resize);bindControls();animate()}
function makeSkyline(){
 const skyGeo=new THREE.SphereGeometry(1500,24,16);const skyMat=new THREE.MeshBasicMaterial({color:0x101b34,side:THREE.BackSide});scene.add(new THREE.Mesh(skyGeo,skyMat));
 // Atmospheric moon glow and distant skyline silhouette
 const moon=new THREE.Mesh(new THREE.SphereGeometry(18,20,16),new THREE.MeshBasicMaterial({color:0x9bb8d2}));moon.position.set(-250,210,-950);scene.add(moon);
 const halo=new THREE.PointLight(0x4779b9,180,900);halo.position.copy(moon.position);scene.add(halo);
 const starGeo=new THREE.BufferGeometry(),starPts=[];for(let i=0;i<420;i++){const a=Math.random()*Math.PI*2,r=500+Math.random()*700;starPts.push(Math.cos(a)*r,100+Math.random()*480,-300-Math.random()*1100)}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPts,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x9fc9e9,size:1.3,transparent:true,opacity:.7})));
}
function makeCity(){
 const concrete=[0x17283b,0x20364a,0x26394a,0x182b40,0x304052].map(c=>new THREE.MeshStandardMaterial({color:c,metalness:.32,roughness:.76}));
 const glass=[0x1b3e59,0x244c66,0x19344f].map(c=>new THREE.MeshStandardMaterial({color:c,metalness:.7,roughness:.22,emissive:c,emissiveIntensity:.12}));
 const windowMats=[0xffc978,0x75dfff,0x9fc9ff,0xff8f70].map(c=>new THREE.MeshBasicMaterial({color:c}));
 // Wide avenue and sidewalks establish scale immediately below the flight path
 const road=new THREE.Mesh(new THREE.PlaneGeometry(92,1500),new THREE.MeshStandardMaterial({color:0x080f1b,metalness:.25,roughness:.82}));road.rotation.x=-Math.PI/2;road.position.set(0,-23,-620);scene.add(road);
 const laneMat=new THREE.MeshBasicMaterial({color:0x73869b,transparent:true,opacity:.35});
 for(let x of [-12,-4,4,12]){const line=new THREE.Mesh(new THREE.PlaneGeometry(.16,1450),laneMat);line.rotation.x=-Math.PI/2;line.position.set(x,-22.88,-620);scene.add(line)}
 const sidewalkMat=new THREE.MeshStandardMaterial({color:0x253447,roughness:.9});for(let x of [-51,51]){const walk=new THREE.Mesh(new THREE.BoxGeometry(9,2,1500),sidewalkMat);walk.position.set(x,-22,-620);scene.add(walk)}
 // Dense near-field building canyon: deliberately starts close enough to be visible on a phone
 for(let z=-34;z>-980;z-=38){for(let side of [-1,1]){const x=side*(64+Math.random()*28),w=22+Math.random()*24,d=24+Math.random()*22,h=42+Math.random()*180;const group=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),concrete[Math.floor(Math.random()*concrete.length)]);body.position.y=h/2-23;group.add(body);const face=new THREE.Mesh(new THREE.BoxGeometry(w*.84,h*.86,.22),glass[Math.floor(Math.random()*glass.length)]);face.position.set(0,h*.43-23,side>0?-d/2-.14:d/2+.14);group.add(face);
   // lit window grid as merged strips, not hundreds of expensive meshes
   for(let row=0;row<Math.floor(h/8);row++){for(let col=0;col<Math.floor(w/4);col++){if(Math.random()<.22)continue;const win=new THREE.Mesh(new THREE.PlaneGeometry(1.25,2.1),windowMats[Math.floor(Math.random()*windowMats.length)]);win.position.set(-w*.38+col*3.3,4+row*7,side>0?-d/2-.28:d/2+.28);if(side<0)win.rotation.y=Math.PI;group.add(win)}}
   const roof=new THREE.Mesh(new THREE.BoxGeometry(w*.35,2,d*.35),new THREE.MeshStandardMaterial({color:0x52677c,metalness:.5,roughness:.5}));roof.position.y=h-22;group.add(roof);group.position.set(x,0,z);scene.add(group);world.push(group);
   if(Math.random()<.42){const sign=new THREE.Mesh(new THREE.BoxGeometry(w*.65,5,.5),new THREE.MeshBasicMaterial({color:Math.random()>.5?0x16a9d1:0xd47c52}));sign.position.set(0,h*.62-23,side>0?-d/2-.5:d/2+.5);group.add(sign)}
  }}
 // Street lamps and glowing traffic ribbons provide depth cues
 for(let z=-25;z>-1000;z-=70){for(let side of [-1,1]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.22,.32,13,6),new THREE.MeshStandardMaterial({color:0x35475b,metalness:.7,roughness:.35}));pole.position.set(side*43,-16.5,z);scene.add(pole);const lamp=new THREE.PointLight(0x6bcfff,9,42);lamp.position.set(side*43,-10,z);scene.add(lamp);}}
 for(let i=0;i<18;i++){const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,5),new THREE.MeshStandardMaterial({color:[0x172b43,0x7b2d2c,0x9c9da4][i%3],metalness:.6,roughness:.32}));car.add(body);for(let side of [-1,1]){const light=new THREE.Mesh(new THREE.BoxGeometry(.45,.18,.08),new THREE.MeshBasicMaterial({color:side===-1?0xff473d:0xffd18a}));light.position.set(side*.7,-.1,-2.54);car.add(light)}car.position.set((Math.random()-.5)*22,-20,-Math.random()*900);scene.add(car);traffic.push(car)}
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),new THREE.MeshStandardMaterial({color:0x091522,metalness:.25,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.position.y=-25;ground.position.z=-500;scene.add(ground);
}
async function loadIron(){
  setLoad('EXTRACTING MARK 85 ASSETS',12);
  try {
    const [sourceResponse, textureResponse] = await Promise.all([fetch('./source.zip'),fetch('./textures.zip')]);
    if(!sourceResponse.ok) throw new Error('source.zip missing from repository root');
    if(!textureResponse.ok) throw new Error('textures.zip missing from repository root');
    const [sourceZip,textureZip]=await Promise.all([JSZip.loadAsync(await sourceResponse.arrayBuffer()),JSZip.loadAsync(await textureResponse.arrayBuffer())]);
    const fbxEntry=Object.values(sourceZip.files).find(f=>!f.dir&&/\.fbx$/i.test(f.name));
    if(!fbxEntry) throw new Error('No FBX file inside source.zip');
    const modelUrl=URL.createObjectURL(await fbxEntry.async('blob'));
    const textureUrls=new Map();
    for(const entry of Object.values(textureZip.files)){
      if(entry.dir||!/\.(png|jpe?g|tga)$/i.test(entry.name)) continue;
      const filename=entry.name.split('/').pop().split('\\').pop();
      textureUrls.set(filename,URL.createObjectURL(await entry.async('blob')));
    }
    setLoad('LOADING MARK 85 MODEL',55);
    const manager=new THREE.LoadingManager();
    manager.setURLModifier(url=>{const name=decodeURIComponent(url.split('/').pop().split('\\').pop());return textureUrls.get(name)||url});
    const loader=new FBXLoader(manager);
    loader.load(modelUrl,obj=>{
      iron=obj;
      const box=new THREE.Box3().setFromObject(iron),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
      const maxDim=Math.max(size.x,size.y,size.z);
      if(!Number.isFinite(maxDim)||maxDim<=0) throw new Error('Invalid FBX dimensions');
      iron.position.sub(center);iron.scale.setScalar(3.5/maxDim);iron.rotation.y=Math.PI;
      iron.traverse(o=>{if(o.isMesh){o.castShadow=false;o.frustumCulled=true;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{m.metalness=Math.max(m.metalness||0,.55);m.roughness=clamp(m.roughness||.4,.2,.7);if(m.emissiveMap){m.emissive=new THREE.Color(0x55dfff);m.emissiveIntensity=1.6}})}}});
      scene.add(iron);iron.position.set(0,0,0);URL.revokeObjectURL(modelUrl);setLoad('MARK 85 ONLINE',100);finishLoad();
    },xhr=>{if(xhr.total)setLoad('LOADING MARK 85 MODEL',55+Math.round(xhr.loaded/xhr.total*40))},error=>{console.error('FBX load failed',error);setLoad('MARK 85 LOAD FAILED — CHECK CONSOLE',100);finishLoad()});
  }catch(error){console.error('Asset extraction failed',error);setLoad('ASSET ERROR: '+error.message,100);finishLoad()}
}
function finishLoad(){setTimeout(()=>$('loading').classList.add('hide'),450)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function bindControls(){const joy=$('joy'),stick=$('stick');function move(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy),k=Math.min(1,max/(len||1));steer.x=dx*k/max;steer.y=-dy*k/max;stick.style.transform=`translate(${dx*k}px,${dy*k}px)`}joy.addEventListener('pointerdown',e=>{joyActive=true;joyId=e.pointerId;joy.setPointerCapture(e.pointerId);move(e)});joy.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId)move(e)});function end(e){if(e.pointerId!==joyId)return;joyActive=false;joyId=null;steer={x:0,y:0};stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);$('boost').addEventListener('pointerdown',()=>boosting=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>$('boost').addEventListener(ev,()=>boosting=false));$('hover').addEventListener('click',()=>{hovering=!hovering;$('hover').classList.toggle('on',hovering);toast(hovering?'HOVER MODE ENGAGED':'HOVER MODE OFF')});$('fire').addEventListener('pointerdown',fire);window.addEventListener('keydown',e=>{if(e.code==='Space')boosting=true;if(e.code==='KeyF')fire();if(e.code==='KeyH')hovering=!hovering;if(e.code==='ArrowLeft'||e.code==='KeyA')steer.x=-1;if(e.code==='ArrowRight'||e.code==='KeyD')steer.x=1;if(e.code==='ArrowUp'||e.code==='KeyW')steer.y=1;if(e.code==='ArrowDown'||e.code==='KeyS')steer.y=-1});window.addEventListener('keyup',e=>{if(e.code==='Space')boosting=false;if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))steer.x=0;if(['ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code))steer.y=0})}
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,900)}
function fire(){const now=performance.now();if(now-lastShot<180||energy<4)return;lastShot=now;energy=Math.max(0,energy-4);const origin=new THREE.Vector3(0,.2,-.2);if(iron)origin.applyMatrix4(iron.matrixWorld);else origin.set(0,0,0);const dir=new THREE.Vector3(steer.x*.18,steer.y*.18,-1).normalize();const m=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0x7deeff}));m.position.copy(origin);scene.add(m);shots.push({mesh:m,vel:dir.multiplyScalar(5),life:90});toast('REPULSOR FIRED')}
function addThruster(pos){const light=new THREE.PointLight(0x3bdcff,2.2,7);light.position.copy(pos);scene.add(light);const geo=new THREE.BufferGeometry();const pts=[];for(let i=0;i<12;i++)pts.push((Math.random()-.5)*.16,-Math.random()*.9,(Math.random()-.5)*.16);geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const p=new THREE.Points(geo,new THREE.PointsMaterial({color:0x76eaff,size:.09,transparent:true,opacity:.8}));p.position.copy(pos);scene.add(p);particles.push({mesh:p,light,life:10+Math.random()*8})}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const target=boosting?1:hovering?0:.45;speed=THREE.MathUtils.damp(speed,target,boosting?2.8:1.5,dt);if(!hovering)altitude=clamp(altitude+steer.y*dt*24,35,260);else altitude=THREE.MathUtils.damp(altitude,120,2,dt);if(iron){iron.position.x=THREE.MathUtils.damp(iron.position.x,steer.x*3.8,3.8,dt);iron.position.y=THREE.MathUtils.damp(iron.position.y,(altitude-120)*.025,3.8,dt);iron.rotation.z=THREE.MathUtils.damp(iron.rotation.z,-steer.x*.28,4,dt);iron.rotation.x=THREE.MathUtils.damp(iron.rotation.x,steer.y*.12,3,dt);iron.position.z=0;iron.updateMatrixWorld(true);if(Math.random()<.55){const p=new THREE.Vector3(-.35,-1.2,-.1).applyMatrix4(iron.matrixWorld);addThruster(p);const q=new THREE.Vector3(.35,-1.2,-.1).applyMatrix4(iron.matrixWorld);addThruster(q)}}cinematicTime+=dt;const intro=cinematicActive&&cinematicTime<7; if(cinematicTime>=7)cinematicActive=false; if(intro&&iron){const t=cinematicTime;const a=t*0.62;const radius=t<3?8: t<5?10:13;const desired=new THREE.Vector3(Math.sin(a)*radius,2.2+Math.sin(t*1.1)*1.2,Math.cos(a)*radius+1.5);const focus=iron.position.clone().add(new THREE.Vector3(0,.1,0));camera.position.lerp(focus.clone().add(desired),Math.min(1,dt*1.8));camera.lookAt(focus)}else{const chaseDist=boosting?13.5:10.5;const desired=new THREE.Vector3((iron?iron.position.x:0)*.55,3.2+steer.y*.45,chaseDist);camera.position.lerp(desired,Math.min(1,dt*(boosting?2.8:2.1)));camera.lookAt(iron?iron.position.clone().add(new THREE.Vector3(0,.15,-7)):new THREE.Vector3(0,0,-7));}camera.fov=THREE.MathUtils.damp(camera.fov,boosting?76:62,2.5,dt);camera.updateProjectionMatrix();for(const b of world){b.position.z+=speed*dt*125;if(b.position.z>55)b.position.z-=1010}for(const car of traffic){car.position.z+=dt*(boosting?42:18);if(car.position.z>24)car.position.z=-930;}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.mesh.position.addScaledVector(s.vel,dt*60);s.life--;if(s.life<=0){scene.remove(s.mesh);s.mesh.geometry.dispose();shots.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt*60;p.mesh.position.y-=dt*1.2;p.mesh.material.opacity=clamp(p.life/12,0,1);p.light.intensity=clamp(p.life/10,0,2);if(p.life<=0){scene.remove(p.mesh,p.light);p.mesh.geometry.dispose();particles.splice(i,1)}}energy=clamp(energy+(boosting?-dt*9:dt*5),0,100);$('energy').style.width=energy+'%';$('alt').textContent=Math.round(altitude);$('spd').textContent=Math.round(speed*(boosting?720:460));if(cinematicTime<2.2)toast('MARK 85 // SYSTEMS ONLINE');else if(cinematicTime>2.2&&cinematicTime<4.8&&Math.floor(cinematicTime*2)%2===0)toast('FLIGHT SYSTEMS ENGAGED');renderer.render(scene,camera)}
init();
