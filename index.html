<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050a12"><title>PROJECT STARK — Flight Test 01</title>
<style>
:root{color-scheme:dark;--cyan:#73e7ff;--gold:#e9bd70;--red:#ff514f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030811;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none;color:#eaf8ff}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:11px;letter-spacing:.28em;color:var(--cyan);font-weight:800}.sub{font-size:9px;letter-spacing:.18em;color:#7893a8;margin-top:4px}.readout{text-align:right;font:10px/1.8 ui-monospace,monospace;color:#b8d5e8}.readout b{color:var(--cyan);font-weight:600}.center{position:absolute;left:50%;top:45%;width:34px;height:34px;transform:translate(-50%,-50%);opacity:.8}.center:before,.center:after{content:"";position:absolute;background:#8cecff;box-shadow:0 0 8px #4bdcff}.center:before{height:1px;width:34px;top:17px}.center:after{width:1px;height:34px;left:17px}.ring{position:absolute;inset:7px;border:1px solid #8cecff;border-radius:50%;opacity:.65}.bottom{position:absolute;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end}.hint{font:9px/1.6 ui-monospace,monospace;letter-spacing:.12em;color:#91aabd;max-width:130px}.controls{display:flex;gap:10px;align-items:flex-end}.btn{pointer-events:auto;border:1px solid #76dfff66;background:linear-gradient(145deg,#10283cdd,#07111ddd);color:#c9f6ff;border-radius:50%;width:62px;height:62px;font-size:9px;letter-spacing:.08em;font-weight:800;box-shadow:inset 0 0 18px #36b8e422,0 0 18px #0008;touch-action:none}.btn:active,.btn.on{background:#1a6680aa;border-color:#9af0ff;box-shadow:0 0 20px #38d9ff77}.btn.fire{width:72px;height:72px;border-color:#ff7b6e88;color:#ffd2c7}.btn.boost{border-color:#eac47788;color:#ffe2a5}.joystick{pointer-events:auto;position:relative;width:116px;height:116px;border:1px solid #7bdfff55;border-radius:50%;background:#071b2b77;box-shadow:inset 0 0 22px #41caff18;touch-action:none}.stick{position:absolute;width:46px;height:46px;left:34px;top:34px;border-radius:50%;border:1px solid #9aeaffaa;background:radial-gradient(circle at 35% 30%,#b9f7ff,#24617d);box-shadow:0 0 18px #48cfff66}.meter{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:min(230px,48vw);height:3px;background:#183448}.meter>i{display:block;height:100%;width:70%;background:linear-gradient(90deg,#43baff,#b7f7ff);box-shadow:0 0 8px #53dfff}.meterlabel{position:absolute;left:50%;bottom:128px;transform:translateX(-50%);font:8px ui-monospace,monospace;letter-spacing:.2em;color:#9ac3d7;white-space:nowrap}#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#10283a,#030811 65%);z-index:5;color:#d9f7ff;text-align:center;transition:opacity .5s}#loading.hide{opacity:0;pointer-events:none}.loaderTitle{font-size:13px;letter-spacing:.34em;font-weight:800}.loaderSub{margin-top:10px;font:10px ui-monospace,monospace;color:#8baabd}.bar{height:2px;width:180px;background:#18384b;margin:20px auto 0}.bar i{display:block;height:100%;width:0;background:#6fe7ff;transition:width .3s}#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);font:10px ui-monospace,monospace;letter-spacing:.18em;color:#9fefff;text-shadow:0 0 10px #29caff;opacity:0;transition:opacity .2s;white-space:nowrap}
@media(max-width:390px){.joystick{width:98px;height:98px}.stick{left:26px;top:26px}.btn{width:54px;height:54px}.btn.fire{width:64px;height:64px}.controls{gap:7px}}
</style></head>
<body><div id="loading"><div><div class="loaderTitle">PROJECT STARK</div><div class="loaderSub" id="loadtext">INITIALIZING FLIGHT SYSTEMS</div><div class="bar"><i id="loadbar"></i></div></div></div><div id="ui"><div class="top"><div><div class="brand">STARK INDUSTRIES</div><div class="sub">MARK 85 // FLIGHT TEST 01</div></div><div class="readout">ALT <b id="alt">120</b> M<br>SPD <b id="spd">0</b> KM/H<br>SYS <b>ONLINE</b></div></div><div class="center"><div class="ring"></div></div><div id="toast">REPULSOR CHARGED</div><div class="meterlabel">ARC REACTOR OUTPUT</div><div class="meter"><i id="energy"></i></div><div class="bottom"><div><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="hint">DRAG TO STEER<br>UP / DOWN TO CLIMB</div></div><div class="controls"><button class="btn boost" id="boost">BOOST</button><button class="btn" id="hover">HOVER</button><button class="btn fire" id="fire">FIRE</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { FBXLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js';
const $=id=>document.getElementById(id);let scene,camera,renderer,clock,iron,world=[],shots=[],particles=[],speed=0,altitude=120,boosting=false,hovering=false,energy=100;let steer={x:0,y:0},joyActive=false,joyId=null,lastShot=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setLoad(t,p){$('loadtext').textContent=t;$('loadbar').style.width=p+'%'}
function makeFallback(){const g=new THREE.Group();const red=new THREE.MeshStandardMaterial({color:0x9f1c22,metalness:.8,roughness:.27}),gold=new THREE.MeshStandardMaterial({color:0xc69a4d,metalness:.85,roughness:.22}),glow=new THREE.MeshBasicMaterial({color:0x5feaff});function part(geo,mat,pos,scale){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.scale.set(...scale);g.add(m);return m}part(new THREE.CapsuleGeometry(.36,.9,6,10),red,[0,0,0],[1,1,1]);part(new THREE.SphereGeometry(.29,16,12),gold,[0,.78,0],[1.05,1.1,.9]);part(new THREE.BoxGeometry(.36,.35,.14),glow,[0,.12,.36],[1,1,1]);for(let s of [-1,1]){part(new THREE.CapsuleGeometry(.13,.65,4,8),red,[s*.53,.15,0],[1,1,1]);part(new THREE.CapsuleGeometry(.12,.62,4,8),red,[s*.22,-.9,0],[1,1,1]);part(new THREE.SphereGeometry(.12,12,8),glow,[s*.53,-.2,.08],[1,1,1]);}g.scale.setScalar(1.5);return g}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x071523);scene.fog=new THREE.FogExp2(0x071523,.0028);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1800);camera.position.set(0,3.5,9);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0x9ddfff,0x17202c,2));const sun=new THREE.DirectionalLight(0xffe5c2,2.5);sun.position.set(-80,150,70);scene.add(sun);const fill=new THREE.PointLight(0x38cfff,65,120);fill.position.set(0,4,4);scene.add(fill);const grid=new THREE.GridHelper(1800,90,0x16415a,0x0d293b);grid.position.y=-30;scene.add(grid);makeCity();loadIron();window.addEventListener('resize',resize);bindControls();animate()}
function makeCity(){const mat1=new THREE.MeshStandardMaterial({color:0x172b3b,metalness:.55,roughness:.65}),mat2=new THREE.MeshStandardMaterial({color:0x20394a,metalness:.45,roughness:.7}),win=new THREE.MeshBasicMaterial({color:0x4d9eb6});for(let z=-100;z>-900;z-=55){for(let x=-260;x<=260;x+=55){if(Math.abs(x)<38)continue;const h=25+Math.random()*115,w=18+Math.random()*18,d=18+Math.random()*18;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),Math.random()>.5?mat1:mat2);b.position.set(x,h/2-20,z-Math.random()*25);scene.add(b);world.push(b);if(Math.random()>.35){const panel=new THREE.Mesh(new THREE.BoxGeometry(w*.72,.18,.12),win);panel.position.set(x,h*.62-20,z-d/2-.08);scene.add(panel);world.push(panel)}}}const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),new THREE.MeshStandardMaterial({color:0x091522,metalness:.25,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.position.y=-25;ground.position.z=-400;scene.add(ground)}
function loadIron(){setLoad('LOADING MARK 85 ASSET',24);const manager=new THREE.LoadingManager();manager.setURLModifier(url=>{const name=decodeURIComponent(url.split('/').pop().split('\\').pop());return /\.(png|jpg|jpeg|tga)$/i.test(name)?'./textures/'+name:url});const loader=new FBXLoader(manager);loader.load('./source/Og.fbx',obj=>{iron=obj;const box=new THREE.Box3().setFromObject(iron);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());iron.position.sub(center);const s=3.5/Math.max(size.y,size.x,size.z);iron.scale.setScalar(s);iron.rotation.y=Math.PI;iron.traverse(o=>{if(o.isMesh){o.castShadow=false;o.frustumCulled=true;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{m.metalness=Math.max(m.metalness||0,.55);m.roughness=clamp(m.roughness||.4,.2,.7);if(m.emissiveMap){m.emissive=new THREE.Color(0x55dfff);m.emissiveIntensity=1.6}})}}});scene.add(iron);iron.position.set(0,0,0);setLoad('MARK 85 ONLINE',100);finishLoad()},undefined,e=>{console.warn('FBX load failed',e);iron=makeFallback();scene.add(iron);setLoad('FLIGHT SYSTEMS ONLINE',100);finishLoad()})}
function finishLoad(){setTimeout(()=>$('loading').classList.add('hide'),450)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function bindControls(){const joy=$('joy'),stick=$('stick');function move(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy),k=Math.min(1,max/(len||1));steer.x=dx*k/max;steer.y=-dy*k/max;stick.style.transform=`translate(${dx*k}px,${dy*k}px)`}joy.addEventListener('pointerdown',e=>{joyActive=true;joyId=e.pointerId;joy.setPointerCapture(e.pointerId);move(e)});joy.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId)move(e)});function end(e){if(e.pointerId!==joyId)return;joyActive=false;joyId=null;steer={x:0,y:0};stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);$('boost').addEventListener('pointerdown',()=>boosting=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>$('boost').addEventListener(ev,()=>boosting=false));$('hover').addEventListener('click',()=>{hovering=!hovering;$('hover').classList.toggle('on',hovering);toast(hovering?'HOVER MODE ENGAGED':'HOVER MODE OFF')});$('fire').addEventListener('pointerdown',fire);window.addEventListener('keydown',e=>{if(e.code==='Space')boosting=true;if(e.code==='KeyF')fire();if(e.code==='KeyH')hovering=!hovering;if(e.code==='ArrowLeft'||e.code==='KeyA')steer.x=-1;if(e.code==='ArrowRight'||e.code==='KeyD')steer.x=1;if(e.code==='ArrowUp'||e.code==='KeyW')steer.y=1;if(e.code==='ArrowDown'||e.code==='KeyS')steer.y=-1});window.addEventListener('keyup',e=>{if(e.code==='Space')boosting=false;if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))steer.x=0;if(['ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code))steer.y=0})}
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,900)}
function fire(){const now=performance.now();if(now-lastShot<180||energy<4)return;lastShot=now;energy=Math.max(0,energy-4);const origin=new THREE.Vector3(0,.2,-.2);if(iron)origin.applyMatrix4(iron.matrixWorld);else origin.set(0,0,0);const dir=new THREE.Vector3(steer.x*.18,steer.y*.18,-1).normalize();const m=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0x7deeff}));m.position.copy(origin);scene.add(m);shots.push({mesh:m,vel:dir.multiplyScalar(5),life:90});toast('REPULSOR FIRED')}
function addThruster(pos){const light=new THREE.PointLight(0x3bdcff,2.2,7);light.position.copy(pos);scene.add(light);const geo=new THREE.BufferGeometry();const pts=[];for(let i=0;i<12;i++)pts.push((Math.random()-.5)*.16,-Math.random()*.9,(Math.random()-.5)*.16);geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const p=new THREE.Points(geo,new THREE.PointsMaterial({color:0x76eaff,size:.09,transparent:true,opacity:.8}));p.position.copy(pos);scene.add(p);particles.push({mesh:p,light,life:10+Math.random()*8})}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const target=boosting?1:hovering?0:.45;speed=THREE.MathUtils.damp(speed,target,boosting?2.8:1.5,dt);if(!hovering)altitude=clamp(altitude+steer.y*dt*24,35,260);else altitude=THREE.MathUtils.damp(altitude,120,2,dt);if(iron){iron.position.x=THREE.MathUtils.damp(iron.position.x,steer.x*3.8,3.8,dt);iron.position.y=THREE.MathUtils.damp(iron.position.y,(altitude-120)*.025,3.8,dt);iron.rotation.z=THREE.MathUtils.damp(iron.rotation.z,-steer.x*.28,4,dt);iron.rotation.x=THREE.MathUtils.damp(iron.rotation.x,steer.y*.12,3,dt);iron.position.z=0;iron.updateMatrixWorld(true);if(Math.random()<.55){const p=new THREE.Vector3(-.35,-1.2,-.1).applyMatrix4(iron.matrixWorld);addThruster(p);const q=new THREE.Vector3(.35,-1.2,-.1).applyMatrix4(iron.matrixWorld);addThruster(q)}}camera.position.x=THREE.MathUtils.damp(camera.position.x,(iron?iron.position.x:0)*.55,2.5,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,3.3+steer.y*.5,2.3,dt);camera.position.z=THREE.MathUtils.damp(camera.position.z,9.5+(boosting?1.8:0),2,dt);camera.lookAt(iron?iron.position.clone().add(new THREE.Vector3(0,.2,-5)):new THREE.Vector3(0,0,-5));for(const b of world){b.position.z+=speed*dt*100;if(b.position.z>35)b.position.z-=825}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.mesh.position.addScaledVector(s.vel,dt*60);s.life--;if(s.life<=0){scene.remove(s.mesh);s.mesh.geometry.dispose();shots.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt*60;p.mesh.position.y-=dt*1.2;p.mesh.material.opacity=clamp(p.life/12,0,1);p.light.intensity=clamp(p.life/10,0,2);if(p.life<=0){scene.remove(p.mesh,p.light);p.mesh.geometry.dispose();particles.splice(i,1)}}energy=clamp(energy+(boosting?-dt*9:dt*5),0,100);$('energy').style.width=energy+'%';$('alt').textContent=Math.round(altitude);$('spd').textContent=Math.round(speed*(boosting?720:460));renderer.render(scene,camera)}
init();
</script></body></html>
